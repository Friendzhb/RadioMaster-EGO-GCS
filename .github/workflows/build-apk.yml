name: Build Native RadioMaster EGO GCS APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not configured}}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore compatible OTA signing certificate
        if: github.repository == 'Friendzhb/RadioMaster-EGO-GCS' && github.event_name != 'pull_request'
        env:
          OTA_KEYSTORE_BASE64: ${{ secrets.EGO_GCS_OTA_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OTA_KEYSTORE_BASE64" || { echo "Missing OTA signing secret" >&2; exit 1; }
          umask 077
          printf '%s' "$OTA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ego-ota-signing.jks"
          echo "EGO_SIGNING_STORE_FILE=$RUNNER_TEMP/ego-ota-signing.jks" >> "$GITHUB_ENV"

      - name: Test ROS UDP bridge
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check formatting, unit tests, lint, and assemble APK
        env:
          EGO_SIGNING_STORE_PASSWORD: ${{ secrets.EGO_GCS_OTA_STORE_PASSWORD }}
          EGO_SIGNING_KEY_ALIAS: ${{ secrets.EGO_GCS_OTA_KEY_ALIAS }}
          EGO_SIGNING_KEY_PASSWORD: ${{ secrets.EGO_GCS_OTA_KEY_PASSWORD }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK and signing compatibility
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk EGO-Pilot-AX12.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not configured}}"
          "$SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs EGO-Pilot-AX12.apk > apk-signature.txt
          if [ -n "${EGO_SIGNING_STORE_FILE:-}" ]; then
            EXPECTED="$(tr -d '[:space:]' < docs/ota-signing-certificate.sha256)"
            ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt | head -n 1)"
            test "$ACTUAL" = "$EXPECTED" || { echo "OTA signing certificate changed" >&2; exit 1; }
          fi
          sha256sum EGO-Pilot-AX12.apk > EGO-Pilot-AX12.apk.sha256
          python3 scripts/build_metadata.py EGO-Pilot-AX12.apk > build-info.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaster-EGO-Pilot-Native-APK
          path: |
            EGO-Pilot-AX12.apk
            EGO-Pilot-AX12.apk.sha256
            build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ego-ota-signing.jks"

  render-scenario-tests:
    runs-on: ubuntu-24.04
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/gcs-avd
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android test environment
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-34" "build-tools;34.0.0" "system-images;android-28;google_apis;x86_64"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n gcs-api28 -k "system-images;android-28;google_apis;x86_64" --path "$ANDROID_AVD_HOME/gcs-api28.avd" --force
          test -f "$ANDROID_AVD_HOME/gcs-api28.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-28\n' "$ANDROID_AVD_HOME/gcs-api28.avd" > "$ANDROID_AVD_HOME/gcs-api28.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd gcs-api28 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Run Android 9 render, lifecycle, and UDP integration scenarios
        run: ./gradlew --no-daemon --stacktrace -Pandroid.injected.device.serial=emulator-5554 :app:connectedDebugAndroidTest
      - name: Collect performance and emulator records
        if: always()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 exec-out run-as com.radiomaster.egogcs cat files/render-benchmark.json > render-benchmark.json || true
          cp "$RUNNER_TEMP/emulator.log" emulator.log || true
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-render-scenario-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            render-benchmark.json
            emulator.log
          retention-days: 7

  publish-apk:
    if: github.repository == 'Friendzhb/RadioMaster-EGO-GCS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-native-apk, render-scenario-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: RadioMaster-EGO-Pilot-Native-APK

      - name: Publish compatible OTA APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: EGO Pilot AX12 latest APK
          body: |
            Native Android development build from commit ${{ github.sha }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            The latest-apk tag is a stable OTA download channel. Exact source and APK hashes are recorded in build-info.json.
          files: |
            EGO-Pilot-AX12.apk
            EGO-Pilot-AX12.apk.sha256
            build-info.json
          fail_on_unmatched_files: true
