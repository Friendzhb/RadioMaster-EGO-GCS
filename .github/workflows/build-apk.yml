name: Build Native RadioMaster EGO GCS APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '*.zip'
      - '**/*.zip'
      - 'app/**'
      - '**/app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Auto-Unpack Uploaded ZIP or Subfolder
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Unpacking ${zips[0]}..."
            mkdir -p _unpack_tmp
            unzip -q -o "${zips[0]}" -d _unpack_tmp
            if [ -d "_unpack_tmp/RadioMaster_EGO_GCS_Native_Android/app" ]; then
              cp -rf _unpack_tmp/RadioMaster_EGO_GCS_Native_Android/* .
            elif [ -d "_unpack_tmp/app" ]; then
              cp -rf _unpack_tmp/* .
            fi
            rm -rf _unpack_tmp
          fi
          if [ ! -f "build.gradle.kts" ] && [ -f "RadioMaster_EGO_GCS_Native_Android/build.gradle.kts" ]; then
            cp -rf RadioMaster_EGO_GCS_Native_Android/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Native Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaster-EGO-Pilot-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct Download Release APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EGO-Pilot-AX12.apk
          gh release delete v1.0-latest -y || true
          gh release create v1.0-latest EGO-Pilot-AX12.apk --title "EGO Pilot Native APK (AX12)" --notes "Pure native Kotlin + OpenGL ES FAST-LIO & EGO-Planner GCS APK"
